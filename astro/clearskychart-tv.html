    outline: none;
    cursor: pointer;
    transition: border-color 0.2s ease,
                box-shadow 0.2s ease;
}

.where-to-dropdown:hover {
    border-color: #ffc600;
}

.where-to-dropdown:focus {
    border-color: #ffc600;
    box-shadow: 0 0 0 3px rgba(255, 198, 0, 0.25);

    <header class="cobalt-header">

        <option value="">-- Select a destination --</option>

<p></p>
<p></p>
<script>
const now = new Date();

var timestamp =
now.getFullYear().toString() +
String(now.getMonth() + 1).padStart(2, '0') +
String(now.getDate()).padStart(2, '0') +
String(now.getHours()).padStart(2, '0') +
String(now.getMinutes()).padStart(2, '0') +
String(now.getSeconds()).padStart(2, '0');

const img = `<img src="https://www.cleardarksky.com/c/KrsObFLcsk.gif?v=${timestamp}"`;

</script>

<div class="bodytext">
    <div class="center">
    <!-- <img src="https://www.cleardarksky.com/c/KrsObFLcsk.gif?c=1512058" /> -->
    <script>document.write(img);</script>

    </div>
</div>

<p></p>

    <footer class="cobalt-footer">
        <span id="copyright"></span>
    </footer>

<script>
    
    const el = document.getElementById("copyright");
    if (el) {
        el.textContent = `© ${new Date().getFullYear()} RAB`;
    }

async function loadProgram() {
    const display = document.getElementById('programDisplay');

    try {
        const response = await fetch('./sirilprogramhelper.c');

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const text = await response.text();
        display.textContent = text;
    }
    catch (err) {
        display.textContent =
            'Unable to load specified file.\n\n' +
            'Make sure:\n' +
            '1. the specified file is in the same folder as this HTML file.\n' +
            '2. The page is served from a web server.\n\n' +
            'Error: ' + err.message;
    }
}

loadProgram();


async function loadResourcesWhereTo() {
    const dropdown = document.getElementById('resourceDropdown');

    try {
        const response = await fetch('./other_resources.json');

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const resources = await response.json();

        resources.sort((a, b) =>
            a.title.localeCompare(b.title)
        );

        dropdown.innerHTML =
            '<option value="">-- Select a destination --</option>';

        resources.forEach(resource => {
            const option = document.createElement('option');
            option.value = resource.url;
            option.textContent = resource.title;
            dropdown.appendChild(option);
        });

    } catch (error) {
        dropdown.innerHTML =
            '<option value="">Unable to load resources</option>';
    }
}

document.getElementById('resourceDropdown')
    .addEventListener('change', function() {

        const url = this.value;

        if (url) {
            window.location.href = url;
        }
    });
loadResourcesWhereTo();

    // const el = document.getElementById("copyright");

    // }

</script>
