<body>

<h1>Astrophotography Planning Tool</h1>

<br>

<label>Starting Time:</label>
<select id="startTime" onchange="selectionChange()" ></select>

<label>Interval (minutes):</label>
<select id="interval" onchange="selectionChange()" ></select>

<br><br>

<button onclick="resetForm()">Reset Form</button>
<button onclick="resequenceDuration()">Calculate Durations</button>
<!-- <pre id="output" style="visibility: hidden;" ></pre> -->
<pre id="output" >Add some viewing objects, then press 'Calculate Durations'</pre>
<button id="copyviewing" onclick="copyViewing()" style="visibility:hidden;">Copy Viewings</button>
<!-- <br><br> -->

<div id="tableContainer"></div>
<label style="visibility: hidden;" id="sizeofevents"></label>
<label style="visibility: hidden;" id="alltimekeys"></label>
<div class="footer copyright"></div>

<script>
// Initialize defaults
const startTime = document.getElementById("startTime");
const interval = document.getElementById("interval");

// Set today's date
const dateInput = new Date();

// Populate time dropdown (24h)
for (let h = 0; h < 24; h++) {
    for (let m = 0; m < 60; m += 5) {
        let value = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        let display = format12Hour(h, m);
        let opt = new Option(display, value);
        if (value === "21:00") opt.selected = true;
        startTime.add(opt);
    }
}

// Populate interval dropdown
for (let i = 5; i <= 55; i += 5) {
    let opt = new Option(i, i);
    if (i === 30) opt.selected = true;
    interval.add(opt);
}

startTime.onchange = selectionChange;

// Format 12-hour time
function format12Hour(h, m) {
    let suffix = h >= 12 ? "PM" : "AM";
    if (m >= 60) { 
        h = h + 1;
        m = 0;
    }
    let hour = h % 12 || 12;
    return `${hour}:${String(m).padStart(2,'0')} ${suffix}`;
}

function addMinutes(date, minutes) {
    return new Date(date.getTime() + minutes*60000);
}

function getRandomInt(min, max) {
    // return Math.floor(Math.random() * (max - min)) + min;
    return 1;
}

function getRandomIntInclusive(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Populate table
function populateTable() {
    let intervalVal = parseInt(interval.value);
    let [h, m] = startTime.value.split(":").map(Number);

    let current = new Date();
    current.setHours(h, m, 0);

    let end = new Date(current);
    end.setDate(end.getDate() + 1);
    end.setHours(8, 0, 0);

    let html = `<table>
    <tr>
        <th>12 Hour-Start</th>
        <th>12 Hour-End</th>
        <th>24 Hour-Start</th>
        <th>24 Hour-End</th>
        <th>Viewing Object</th>
        <th>Duration</th>
    </tr>`;

    let prevTime = null;

    let objectNames = new Array();
    let objectIdx = 0;
    let workingDate = current;

    const placeholdersarray = ["Whirlpool Galaxy (M51)", "Leo Triplet (M65, M66, NGC 3628)", "Sombrero Galaxy (M104)", "NGC 2683 - UFO Galaxy", "M63 (Sunflower Galaxy)"   ,"Turtle Nebula","Horsehead Dark Cloud","NGC 3513","Deer Lick Group" ,"Cepheus Flare Dark Cloud"];
    var placeholdertext = placeholdersarray[getRandomIntInclusive(0, placeholdersarray.length - 1)];

    var savetimes = "";
    var times  = "";
    var timespre = "";
    while (workingDate <= end) {
        let h = workingDate.getHours();
        let m = workingDate.getMinutes();

        let time12 = format12Hour(h, m);
        let time24 = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
        
        workingDate = addMinutes(workingDate, intervalVal);
        
        let he = workingDate.getHours();
        let me = workingDate.getMinutes();
        
        let time12End = format12Hour(he, me);
        let time24End = `${String(he).padStart(2,'0')}:${String(me).padStart(2,'0')}`;

        let duration = prevTime ? ((current - prevTime) / 60000) + " mins" : "";

        let objectName = "test";
        let durationLabelName = "durlabel";
        let objectTextName = 'objname';
        objectTextNameItem = objectTextName + objectIdx;
        durationLabelNameItem = durationLabelName + objectIdx;
        let starttime12 = "starttime12_" + objectIdx;
        let starttime24 = "starttime24_" + objectIdx;
       
        // let timesholder = "timesholder_" + objectIdx;

        times = times + timespre + objectIdx + "_" + time12 + "|" + time12End + "|" + time24 + "|" + time24End;
        timespre = "#";
        html += `<tr>
            <td><label for="${starttime12}" >${time12}</label> </td>
            <td>${time12End}</td>
            <td>${time24}</td>
            <td>${time24End}</td>
            <td>
                <input class="object-input" type="text" value="" id="${objectTextNameItem}" placeholder="${placeholdertext}" >
                </td>
            <td>
                <label for="durationLabel" id="${durationLabelNameItem}"></label>
                </td>
                </tr>`;

        prevTime = new Date(current);
        current.setMinutes(current.getMinutes() + intervalVal);
        objectIdx++;
        placeholdertext = placeholdersarray[getRandomIntInclusive(0, placeholdersarray.length - 1)];
    }

    html += `</table>`;

    document.getElementById("tableContainer").innerHTML = html;
    document.getElementById("sizeofevents").innerHTML = (objectIdx - 1);
    document.getElementById("alltimekeys").innerHTML =  times;
}

const TimeType = {
  START12: 0,
  END12: 1,
  START24: 2,
  END24: 3
};

function getTimings(s, t) {
 var parts = s.split('_')[1].split('|');
 return parts[t];
}

class ViewingDisplay {
    starttime12 = "";
    starttime24 = "";
    endtime12 = "";
    endtime24 = "";
    duration = 0;
    
    constructor(objectname, timestring) { 
        this.objectname = objectname;
        this.starttime12 = timestring;
        this.starttime12 = getTimings(timestring, TimeType.START12);
        this.starttime24 =  getTimings(timestring, TimeType.START24);
    }

    setEndTimes(timestring) {
        this.endtime12 = getTimings(timestring, TimeType.END12);
        this.endtime24 =  getTimings(timestring, TimeType.END24);
    }

    setDuration(duration) {
        this.duration = duration;
    }

    getDisplayString() {
        var rv = "";
        rv += this.objectname + " " +  this.starttime12;
        rv += " - " + this.endtime12;
        rv += " (" + this.starttime24;
        rv += " - " + this.endtime24 + ")";
        rv += " duration: " + this.duration + " minutes";
        return rv;
    }
}

function buildViewings() {
    var indexmax = document.getElementById("sizeofevents").innerHTML;
    let intervalVal = parseInt(interval.value);
    var objs = document.querySelectorAll('[id^="objname"]');
    var times1 = document.getElementById("alltimekeys").innerHTML;
    var timekeys = times1.split('#');

    document.getElementById("output").innerHTML = "";

    const displayOjbects = [];
    const populatedIndex = [];
    const endingIndex = [];
    for (let i = 0; i < indexmax; i++) {
        var objectname = "objname" + i;
        var obj = document.getElementById(objectname).value;
        var objsize = obj.trim().length;
                
        if (objsize > 0) {
            populatedIndex.push(i);
            if (obj.toLowerCase().trim() === "stop") {
                i += indexmax;
            }
        }
    }

    if (populatedIndex.length == 1) {
         endingIndex.push(indexmax);
    }
    else {
        for (let i = 1; i < populatedIndex.length; i++) {
            endingIndex.push(populatedIndex[i] - 1);
        }    
        if (endingIndex.length == populatedIndex.length - 1) {
             endingIndex.push(indexmax);
        }
    }

    for (let i = 0; i < populatedIndex.length; i++) {
            var objectname = "objname" + populatedIndex[i];
            var obj = document.getElementById(objectname).value;  
            const myv = new ViewingDisplay(obj, timekeys[populatedIndex[i]]);
            myv.setEndTimes(timekeys[endingIndex[i]]);
            var dur = endingIndex[i] != populatedIndex[i] 
                ? (((endingIndex[i] - populatedIndex[i]) * intervalVal) + intervalVal)
                : intervalVal;
            myv.setDuration(dur);
            document.getElementById("output").innerHTML += myv.getDisplayString() + "<br>";
    }  

    if (populatedIndex.length == 0) {
        hideUI();
    }
    else {
        document.getElementById("copyviewing").style.visibility = "visible";
        document.getElementById("output").style.visibility = "visible";
    }
}

function resequenceDuration() {
    var indexmax = document.getElementById("sizeofevents").innerHTML;
    let intervalVal = parseInt(interval.value);
    var objs = document.querySelectorAll('[id^="objname"]');
    var durs = document.querySelectorAll('[id^="durlabel"]');
    var dursresult = "";
    var foundinterval = -1;
     for (let i = 0; i < indexmax; i++) {
        var elem = objs[i].value;
        if (elem === null || elem.trim() === "") {
            if (foundinterval < 0) {
            dursresult = "";
            }
            else {
                foundinterval = foundinterval + intervalVal;
                dursresult = foundinterval;
            }
        }
        else {
            foundinterval = intervalVal;
            dursresult = foundinterval;
        }
        durs[i].innerHTML = dursresult;
    }

    hideUI();
    document.getElementById("output").innerHTML = "Add some viewing objects, then press 'Calculate Durations'";

    buildViewings();

}

// Clear form
function resetForm() {
    startTime.value = "21:00";
    interval.value = "30";
    hideUI();
    populateTable();
      document.getElementById("output").innerHTML = "Add some viewing objects, then press 'Calculate Durations'";
}

function hideUI() {
        document.getElementById("output").innerHTML = "";

    document.getElementById("copyviewing").style.visibility =  "hidden";
    // document.getElementById("output").style.visibility = "hidden";
    document.getElementById("output").innerHTML = "Add some viewing objects, then press 'Calculate Durations'";
}

function selectionChange() {
    hideUI();
    populateTable();
}


// Copy page
function copyViewing() {
    // navigator.clipboard.writeText(document.getElementById("output").innerHTML)
    navigator.clipboard.writeText(document.getElementById("output").innerHTML.replaceAll("<br>", "\n"))
        .then(() => alert("Viewings copied!"));
}

function setCopyright() {
    document.querySelectorAll('.copyright')
    .forEach(el => el.innerHTML =
    `© ${new Date().getFullYear()} nanoC13.com`
    // `© ${new Date().getFullYear()} The Villages Astronomy Club`
        );
}

populateTable();

document.addEventListener('DOMContentLoaded', setCopyright);
</script>
